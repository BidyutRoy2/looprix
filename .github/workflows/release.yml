name: Release (Windows)

# Builds the Windows installer (.exe), .msi and portable zip on GitHub's
# Windows runner and publishes them to a GitHub Release.
# Trigger: push a tag like v0.1.0, or run manually from the Actions tab.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable

      # FFmpeg is bundled as a sidecar (src-tauri/binaries/ffmpeg.exe) so the
      # installed app works offline. Fail loudly if the download breaks —
      # never silently ship a build without ffmpeg.
      - name: Download FFmpeg (Windows, gyan.dev essentials)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip' -OutFile "$env:TEMP\ffmpeg.zip"
          Expand-Archive -Path "$env:TEMP\ffmpeg.zip" -DestinationPath "$env:TEMP\ffmpeg"
          $exe = Get-ChildItem -Path "$env:TEMP\ffmpeg" -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $exe) { throw 'ffmpeg.exe not found in downloaded archive' }
          New-Item -ItemType Directory -Force -Path 'src-tauri\binaries' | Out-Null
          Copy-Item $exe.FullName 'src-tauri\binaries\ffmpeg.exe'
          & 'src-tauri\binaries\ffmpeg.exe' -version | Select-Object -First 1

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app (NSIS + MSI)
        run: npm run tauri build

      - name: Check bundle outputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $nsis = Get-ChildItem 'src-tauri\target\release\bundle\nsis\*.exe' -ErrorAction SilentlyContinue
          $msi = Get-ChildItem 'src-tauri\target\release\bundle\msi\*.msi' -ErrorAction SilentlyContinue
          $bin = Get-Item 'src-tauri\target\release\looprix.exe' -ErrorAction SilentlyContinue
          if (-not $nsis) { throw 'NSIS installer .exe not found' }
          if (-not $bin) { throw 'looprix.exe not found' }
          Write-Host "NSIS: $($nsis.FullName) ($([math]::Round($nsis.Length / 1MB, 2)) MB)"
          if ($msi) { Write-Host "MSI: $($msi.FullName) ($([math]::Round($msi.Length / 1MB, 2)) MB)" }

      - name: Package portable build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path 'Looprix-Portable' | Out-Null
          Copy-Item 'src-tauri\target\release\looprix.exe' 'Looprix-Portable\Looprix.exe'
          Copy-Item 'src-tauri\binaries\ffmpeg.exe' 'Looprix-Portable\ffmpeg.exe'
          @'
          Looprix v0.1.0 — Portable (Windows 10/11 64-bit)
          =================================================
          No install needed. Unzip anywhere and double-click Looprix.exe.

          Requirements: WebView2 (preinstalled on Windows 10/11).
          ffmpeg.exe must stay next to Looprix.exe.

          First run:
          1. YouTube Studio > Create > Go Live — enable live (first time can take 24h).
          2. In Looprix, pick Manual Stream Key, paste the Stream URL + Key, Save Key Securely.
          3. Add a video, pick a preset (e.g. Waz), wait for Stream Doctor to go all green, press GO LIVE.
          4. Test the first stream as Private/Unlisted, then go Public.

          Developed by Bidyut Roy — https://github.com/BidyutRoy2
          '@ | Set-Content -Path 'Looprix-Portable\README-Portable.txt' -Encoding UTF8
          Compress-Archive -Path 'Looprix-Portable\*' -DestinationPath 'Looprix-Portable-0.1.0.zip'
          Get-Item 'Looprix-Portable-0.1.0.zip' | Select-Object Name, Length

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Looprix-Windows-0.1.0
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            Looprix-Portable-0.1.0.zip
          if-no-files-found: error

      # Only a tag push creates the public Release. A manual dispatch just
      # leaves the artifacts above for download from the Actions run.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            Looprix-Portable-0.1.0.zip
          generate_release_notes: true
