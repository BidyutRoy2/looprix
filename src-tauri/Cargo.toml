[package]
name = "looprix"
version = "0.1.1"
description = "Looprix — lightweight Windows desktop app that streams pre-recorded video as YouTube Live via RTMPS. Developed by Bidyut Roy — https://github.com/BidyutRoy2"
authors = ["Bidyut Roy <https://github.com/BidyutRoy2>"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
keyring = "4"
anyhow = "1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
